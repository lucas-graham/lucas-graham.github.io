<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Dumbbell between self-closing HTML brackets</title>
  <desc id="desc">SVG recreation of a dumbbell icon placed between &lt; and /&gt; symbols.</desc>
  
  <!-- Left bracket: &lt; -->
  <text x="0" y="100" font-family="monospace" font-size="240" font-weight="bold" fill="#ff0000" dominant-baseline="middle">&lt;</text>
  
  <!-- Dumbbell -->
  <!-- Bar -->
  <rect x="145" y="85" width="140" height="30" rx="5" fill="#2c3e50" />
  
  <!-- Left weight -->
  <rect x="120" y="38" width="70" height="120" rx="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="8" />
  
  <!-- Right weight -->
  <rect x="240" y="38" width="70" height="120" rx="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="8" />
  
  <!-- Center grip highlight on bar -->
  <rect x="195" y="90" width="40" height="10" fill="#34495e" />

  <!-- Right bracket: &gt; -->
  <text x="300" y="100" font-family="monospace" font-size="240" font-weight="bold" fill="#ff0000" dominant-baseline="middle">&gt;</text>
</svg>